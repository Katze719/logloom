[package]
name = "logloom"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
description = "Parse, validate, and export changelogs with a CLI and Rust library"
license = "MIT"
repository = "https://github.com/Katze719/logloom"
documentation = "https://docs.rs/logloom"
readme = "README.md"
keywords = ["changelog", "release-notes", "markdown", "parser", "cli"]
categories = ["command-line-utilities", "parser-implementations", "development-tools"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/clippy.toml",
    "/rust-toolchain.toml",
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/docs/**",
]

[dependencies]
annotate-snippets = "0.12.17"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tempfile = "3.25.0"
toml = "1.2.0"
unicase = "2.10.0"
yaml_serde = "0.10.7"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[package]
name = "logloom"
version = "1.1.0"
edition = "2024"
rust-version = "1.99"
description = "Parse, validate, and export changelogs with a CLI and Rust library"
license = "MIT"
repository = "https://github.com/Katze719/logloom"
documentation = "https://docs.rs/logloom"
readme = "README.md"
keywords = ["changelog", "release-notes", "markdown", "parser", "cli"]
categories = ["command-line-utilities", "parser-implementations", "development-tools"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/clippy.toml",
    "/rust-toolchain.toml",
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/docs/**",
    "/benches/**",
]

[[bin]]
name = "logloom"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "parser"
harness = false

[features]
default = ["cli", "yaml", "toml", "csv"]
cli = ["dep:annotate-snippets", "dep:clap", "dep:clap_complete", "dep:tempfile", "dep:unicase"]
yaml = ["cli", "dep:yaml_serde"]
toml = ["cli", "dep:toml"]
csv = ["cli", "dep:csv"]

[dependencies]
annotate-snippets = { version = "0.12.17", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
clap_complete = { version = "4.6.11", optional = true }
csv = { version = "1.4.0", optional = true }
pulldown-cmark = { version = "0.13.6", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tempfile = { version = "3.25.0", optional = true }
toml = { version = "1.2.0", optional = true }
unicase = { version = "2.10.0", optional = true }
yaml_serde = { version = "0.10.7", optional = true }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

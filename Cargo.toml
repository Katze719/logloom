[package]
name = "logloom"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Parse changelog documents into an ordered, serializable model"
license = "MIT"

[dependencies]
annotate-snippets = "0.12.17"
clap = { version = "4.6.7", features = ["derive"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
